version: 2
updates:
  - package-ecosystem: npm # Dependabot handles pnpm lockfiles via the npm ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-breaking bumps; majors still get their own PR each
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # primevue 5+ / primeicons 8+ / @primeuix 3+ are under the commercial PrimeUI license — see CLAUDE.md
      - dependency-name: primevue
        versions: ['>=5']
      - dependency-name: primeicons
        versions: ['>=8']
      - dependency-name: '@primeuix/*'
        versions: ['>=3']
      # types follow the Node inside Electron (45 → Node 24); bump together with Electron
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native compiler): typescript-eslint allows <6.1 and vue-tsc needs the JS API — drop once both support it
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
