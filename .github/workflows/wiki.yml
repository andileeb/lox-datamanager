name: Wiki

# docs/ is the source; the wiki is regenerated from it (scripts/wiki-sync.mts)
on:
  push:
    branches: [main]
    paths: [docs/**, scripts/wiki-sync.mts, .github/workflows/wiki.yml]
  workflow_dispatch:

permissions:
  contents: write # the wiki repo counts as this repo's contents

concurrency: wiki

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/wiki-sync.mts docs wiki
      - name: Push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync from docs/ at ${GITHUB_SHA::7}"
          git push
